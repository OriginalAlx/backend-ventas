# 1. La direcci\u00f3n de tu base de datos (jdbc:postgresql://localhost:puerto/nombre_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/ventas_db

# 2. Tus credenciales de PostgreSQL
spring.datasource.username=postgres
spring.datasource.password=123456

# 3. El driver que acabamos de instalar
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. La magia de Hibernate: 'update' crea o actualiza las tablas autom\u00e1ticamente
spring.jpa.hibernate.ddl-auto=update

# 5. (Opcional) Muestra el SQL en la consola para que veas qu\u00e9 hace JPA por detr\u00e1s
spring.jpa.show-sql=true